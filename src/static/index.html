<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rent vs Buy — Canada &amp; the United States</title>
<meta name="description" content="Rent versus buy for Canada and the United States, with an investment property model, mortgage helper income, and an appreciation calculator.">
<meta name="theme-color" content="#E7E9E3">
<meta name="color-scheme" content="light dark">
<!-- Theme is resolved before first paint, from a cookie scoped to
     .rishabhdoshi.com so the choice carries over from the portfolio
     and the experiments index. app.js is deferred, so without this the
     dark-mode visitor gets a flash of the light shell on every load. -->
<script>
(function(){
  var m=document.cookie.match(/(?:^|;\s*)sheet-theme=(light|dark)/),t=m&&m[1];
  if(!t){ try{ t=localStorage.getItem('sheet-theme'); }catch(e){} }
  if(t!=='light'&&t!=='dark')
    t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  var bg=t==='dark'?'#0E1C2B':'#E7E9E3';
  var r=document.documentElement;
  r.setAttribute('data-theme',t);
  r.style.setProperty('--rvb-bg',bg);
  r.style.colorScheme=t;
  document.addEventListener('DOMContentLoaded',function(){
    var mt=document.querySelector('meta[name="theme-color"]');
    if(mt)mt.setAttribute('content',bg);
  });
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rent vs Buy">
<link rel="preload" href="fonts/IBMPlexSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root"></div>
<script src="app.js" defer></script>
</body>
</html>
