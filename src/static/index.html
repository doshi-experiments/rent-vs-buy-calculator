<!-- Theme is resolved before first paint, from a cookie scoped to
     .rishabhdoshi.com so the choice carries over from the portfolio
     and the experiments index. app.js is deferred, so without this the
     dark-mode visitor gets a flash of the light shell on every load. -->
<script>
(function(){
  var m=document.cookie.match(/(?:^|;\s*)sheet-theme=(light|dark)/),t=m&&m[1];
  if(!t){ try{ t=localStorage.getItem('sheet-theme'); }catch(e){} }
  if(t!=='light'&&t!=='dark')
    t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  var bg=t==='dark'?'#0E1C2B':'#E7E9E3';
  var r=document.documentElement;
  r.setAttribute('data-theme',t);
  r.style.setProperty('--rvb-bg',bg);
  r.style.colorScheme=t;
  document.addEventListener('DOMContentLoaded',function(){
    var mt=document.querySelector('meta[name="theme-color"]');
    if(mt)mt.setAttribute('content',bg);
  });
})();
</script>
