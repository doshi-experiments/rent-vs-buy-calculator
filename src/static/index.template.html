<!doctype html>
<html lang="en" data-project="calculator" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- TEMPLATE. build.sh renders one copy of this per entry in
     src/routes.json, substituting the {{...}} placeholders, and writes each
     to its own directory so every tab is a real URL with real metadata.
     Never edit dist/ — edit this. -->
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="theme-color" content="#F1F5F7">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Rent vs Buy Calculator">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{ORIGIN}}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Rent vs. Buy Calculator for Canada and the United States">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{ORIGIN}}/og-image.png">
<meta name="twitter:image:alt" content="Rent vs. Buy Calculator for Canada and the United States">

<script type="application/ld+json">
{{JSONLD}}
</script>
<script src="/design-system/prepaint.js"></script>
<!-- Root-absolute, not relative: these same tags are served from
     /prepayment/ and the rest, where "app.js" would resolve to
     /prepayment/app.js and 404. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" sizes="32x32">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rent vs Buy">
<link rel="preload" href="/fonts/commissioner-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="ds-skip" href="#main">Skip to content</a>
<div id="root" tabindex="-1"></div>
<!-- The app needs JavaScript to run the mortgage math, but a crawler or a
     JS-disabled visitor should still find real words and real links here
     rather than an empty shell. -->
<noscript>
  <div style="font-family:var(--ds-font-body);max-width:64ch;margin:60px auto;padding:0 20px;line-height:1.55;color:var(--ds-text)">
    <h1>{{H1}}</h1>
    <p>{{LEAD}}</p>
    <p>This calculator needs JavaScript to run. Please enable it in your
       browser to use it.</p>
    <p><b>All calculators:</b><br>{{NAVLINKS}}</p>
    <p><a href="https://rishabhdoshi.com/">Home</a> /
       <a href="https://experiments.rishabhdoshi.com/">Experiments</a></p>
  </div>
</noscript>
<script src="/app.js" defer></script>
</body>
</html>
